rules:
  - id: orchestrate.no-public-form
    message: The static public site must not collect visitor data through forms.
    severity: ERROR
    languages: [typescript, javascript]
    pattern-either:
      - pattern: <form ...>...</form>
      - pattern: $FACTORY("form", ...)

  - id: orchestrate.no-unsafe-dom-html
    message: The static site must not introduce unsafe HTML injection APIs.
    severity: ERROR
    languages: [typescript, javascript]
    paths:
      exclude: [/scripts/**]
    pattern-either:
      - pattern: $ELEMENT.innerHTML = $VALUE
      - pattern: $ELEMENT.outerHTML = $VALUE
      - pattern: $ELEMENT.insertAdjacentHTML(...)
      - pattern: document.write(...)
      - pattern: 'Object.assign($ELEMENT, { ..., innerHTML: $VALUE, ... })'
      - pattern: Reflect.set($ELEMENT, "innerHTML", $VALUE)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $ASSIGN = Object.assign;
                  ...
              - pattern-inside: |
                  let $ASSIGN = Object.assign;
                  ...
          - pattern: '$ASSIGN($ELEMENT, { ..., innerHTML: $VALUE, ... })'

  - id: orchestrate.no-runtime-data-collection
    message: The static public site must not send or collect runtime data.
    severity: ERROR
    languages: [typescript, javascript]
    paths:
      exclude: [/scripts/**]
    pattern-either:
      - pattern: fetch(...)
      - pattern: window.fetch(...)
      - pattern: globalThis.fetch(...)
      - pattern: navigator.sendBeacon(...)
      - pattern: new XMLHttpRequest(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $SEND = fetch;
                  ...
              - pattern-inside: |
                  let $SEND = fetch;
                  ...
          - pattern: $SEND(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $SEND = window.fetch;
                  ...
              - pattern-inside: |
                  let $SEND = window.fetch;
                  ...
              - pattern-inside: |
                  const $SEND = globalThis.fetch;
                  ...
              - pattern-inside: |
                  let $SEND = globalThis.fetch;
                  ...
          - pattern: $SEND(...)
      - patterns:
          - pattern-inside: |
              const $SEND = navigator.sendBeacon;
              ...
          - pattern: $SEND(...)

  - id: orchestrate.no-browser-storage
    message: The static public site must not persist visitor data in browser storage.
    severity: ERROR
    languages: [typescript, javascript]
    paths:
      exclude: [/scripts/**]
    pattern-either:
      - pattern: localStorage.$METHOD(...)
      - pattern: sessionStorage.$METHOD(...)
      - pattern: window.localStorage.$METHOD(...)
      - pattern: window.sessionStorage.$METHOD(...)
      - pattern: globalThis.localStorage.$METHOD(...)
      - pattern: globalThis.sessionStorage.$METHOD(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $STORAGE = localStorage;
                  ...
              - pattern-inside: |
                  let $STORAGE = localStorage;
                  ...
          - pattern: $STORAGE.$METHOD(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $STORAGE = window.localStorage;
                  ...
              - pattern-inside: |
                  let $STORAGE = window.localStorage;
                  ...
              - pattern-inside: |
                  const $STORAGE = window.sessionStorage;
                  ...
              - pattern-inside: |
                  let $STORAGE = window.sessionStorage;
                  ...
              - pattern-inside: |
                  const $STORAGE = globalThis.localStorage;
                  ...
              - pattern-inside: |
                  let $STORAGE = globalThis.localStorage;
                  ...
              - pattern-inside: |
                  const $STORAGE = globalThis.sessionStorage;
                  ...
              - pattern-inside: |
                  let $STORAGE = globalThis.sessionStorage;
                  ...
          - pattern: $STORAGE.$METHOD(...)
      - patterns:
          - pattern-inside: |
              const $STORAGE = sessionStorage;
              ...
          - pattern: $STORAGE.$METHOD(...)

  - id: orchestrate.no-runtime-environment-config
    message: Keep the static site independent of runtime environment configuration and secrets.
    severity: ERROR
    languages: [typescript, javascript]
    paths:
      exclude: [/scripts/**]
    pattern-either:
      - pattern: import.meta.env.$KEY
      - pattern: import.meta.env[$KEY]
      - pattern: process.env.$KEY
      - pattern: process.env[$KEY]
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $ENV = import.meta.env;
                  ...
              - pattern-inside: |
                  let $ENV = import.meta.env;
                  ...
          - pattern: $ENV.$KEY
      - patterns:
          - pattern-inside: |
              const $ENV = process.env;
              ...
          - pattern: $ENV.$KEY
      - pattern: const { $KEY } = import.meta.env
      - pattern: const { $KEY } = process.env
